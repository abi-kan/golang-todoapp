paths:
  /users:
    get:
      description: Get a list of users with optional pagination
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: The users list has been successfully retrieved
          schema:
            items:
              $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_features_users_dto.User'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Get users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user in the system
      parameters:
      - description: CreateUser request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_features_users_dto.CreateUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: User has been successfully created
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_features_users_dto.CreateUserOutput'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: Delete an existing user in the system by ID
      parameters:
      - description: ID of the user to delete
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: User has been successfully deleted
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Delete user
      tags:
      - users
    get:
      description: Get a concrete user by ID
      parameters:
      - description: ID of the user to get
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User has been successfully found
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_features_users_dto.GetUserOutput'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Get user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Change a existing user's info in the system.
        ### Logic of the request body fields (Tree-state logic):
        1. **Field is missing**: `phone_number` is ignored, value in the database won't change.
        2. **Field value is specified**: `"phone_number": "+79998887766"` new value will be saved to the database.
        3. **Field value is null**: `"phone_number": null` current value in the database will be removed (set to NULL).
        4. Restrictions: `full_name` can't be set to null
      parameters:
      - description: ID of the user to change
        in: path
        name: id
        required: true
        type: integer
      - description: PatchUser request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_features_users_dto.PatchUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: User has been successfully changed
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_features_users_dto.PatchUserOutput'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_abi-kan_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Change user
      tags:
      - users
